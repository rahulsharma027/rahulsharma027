      <stop offset="0" stop-color="#151c17"/>
      <stop offset="1" stop-color="#0d1210"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="350" rx="12" fill="url(#background)"/>
  <rect width="1200" height="350" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="348" rx="11" fill="none" stroke="#c7edaa" stroke-opacity="0.14" stroke-width="2"/>
