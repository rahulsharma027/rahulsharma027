<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Rahul Sharma — Software engineer, Go and Java, cloud platforms</title>
  <desc id="banner-description">A dark banner with lime lettering and a pixel robot following a path through a maze. Build. Debug. Find a better path.</desc>
  <defs>
