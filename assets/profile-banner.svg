    <text x="51" y="180" fill="#58a6ff" font-size="15" letter-spacing="2.5">SOFTWARE ENGINEER / GO · JAVA · CLOUD</text>
    <text x="51" y="232" fill="#8b949e" font-size="19">Build. Debug. Find a better path.</text>
